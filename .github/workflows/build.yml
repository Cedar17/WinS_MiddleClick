name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            exe: WinS_MiddleClick-x64.exe
          - arch: arm64
            cmake_arch: ARM64
            exe: WinS_MiddleClick-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          $src = Join-Path $PWD "build/Release/${{ matrix.exe }}"
          if (-not (Test-Path $src)) { throw "Missing output: $src" }
          Copy-Item $src "${{ matrix.exe }}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinS_MiddleClick-${{ matrix.arch }}
          path: ${{ matrix.exe }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinS_MiddleClick-x64.exe
            dist/WinS_MiddleClick-arm64.exe
          generate_release_notes: true
